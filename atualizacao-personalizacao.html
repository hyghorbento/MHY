<!-- MHY v2: personalização e catálogo público. Inserir antes de </body>. -->
<style>
:root{--brand:#D4AF37;--brand-ink:#151207;--store-bg:#0c0d10}
body{background:var(--store-bg)}
.gold{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.active{background:color-mix(in srgb,var(--brand) 12%,transparent);border-color:var(--brand);color:var(--brand)}
.badge{background:color-mix(in srgb,var(--brand) 10%,transparent);color:var(--brand)}
a,summary{color:var(--brand)}
button:hover{border-color:var(--brand)}
input:focus,select:focus,textarea:focus{outline-color:var(--brand)}
textarea{width:100%;padding:11px;border:1px solid #383940;border-radius:9px;background:#0e0f13;color:#fff;resize:vertical}
.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:12px;background:#fff;padding:4px}
.brand-preview{width:100%;max-height:190px;object-fit:cover;border-radius:12px;background:#24252b}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:20px}
.check-line{display:flex;align-items:center;gap:10px;cursor:pointer}
.check-line input{width:20px;height:20px;accent-color:var(--brand)}
.catalog-mode>header,.catalog-mode>main,.catalog-mode>dialog:not(#catalogCartDialog){display:none!important}
#storefrontRoot{max-width:1200px;margin:auto;padding:20px 20px 130px}
.store-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.store-hero{position:relative;isolation:isolate;overflow:hidden;min-height:240px;display:flex;align-items:center;border:1px solid #34353b;border-radius:24px;margin-bottom:24px;background:linear-gradient(120deg,#28251c,#17181d)}
.store-hero>img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.store-hero:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#000d,#0005)}
.store-hero>div{padding:34px;max-width:650px}
.store-hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:10px 0}
.store-hero p{color:#ddd;line-height:1.6;white-space:pre-line}
.store-filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.store-filters input{flex:2;min-width:180px}.store-filters select{flex:1;min-width:160px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:20px}
.store-card{overflow:hidden;border:1px solid #303139;border-radius:18px;background:#15161b;display:flex;flex-direction:column}
.store-card>img{width:100%;height:230px;object-fit:contain;background:#202127;padding:14px}
.store-card-content{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.store-card h2{overflow-wrap:anywhere}.store-card p{color:#aaa;white-space:pre-line;font-size:14px;overflow-wrap:anywhere}
.store-card .store-price{font-size:23px;color:var(--brand);font-weight:700}
.store-card button{margin-top:auto}.store-card button:disabled{cursor:not-allowed}
.store-dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 32px));padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#1b1c22f5;border:1px solid var(--brand);border-radius:16px;z-index:10;box-shadow:0 10px 35px #0008}
.store-dock small{display:block}.store-dock button{flex-shrink:0}
.public-status{padding:50px 20px;text-align:center;max-width:650px;margin:40px auto}
.catalog-note{color:#a2a4b0;font-size:13px;line-height:1.6}
#catalogCartDialog .dialog-header{position:static}
#catalogFeedback{white-space:pre-line;color:var(--brand)}
#catalogLink{font-size:13px;overflow-wrap:anywhere}
.version-label{font-size:11px;color:var(--brand);margin-left:5px}
@media(max-width:420px){#storefrontRoot{padding:16px 16px 140px}.store-hero>div{padding:24px}.store-dock{padding:12px}.store-dock button{padding:10px}.store-card>img{height:240px}}
</style>
<script>
// Extensão isolada: reutiliza o CRUD e as taxas existentes, sem substituir o banco.
(() => {
  if(window.__MHY_BRANDING_V2__)return;
  window.__MHY_BRANDING_V2__=true;
  const storeId = new URLSearchParams(location.search).get('loja');
  const publicMode = storeId !== null;
  const defaults = {
    name:'MHY IMPORTS',tagline:'Escolhas especiais para o seu dia a dia.',
    headline:'Encontre seu próximo favorito.',whatsapp:'5541995492589',accent:'#D4AF37',
    background:'#0c0d10',logo:null,banner:null,published:false
  };
  let settings={...defaults},media={logo:null,banner:null},dirty=false;
  let settingsAvailable=true,settingsSaveBusy=false;
  let publicSettings=null,publicProducts=[],publicCart=new Map();
  let publicClient=null,publicBusy=false,publicReady=false;
  let publicRefreshTimer=null,publicCartDialog=null,publicRefreshPromise=null;
  const validId=value=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value||'');
  const imageSource=value=>/^data:image\/jpeg;base64,/.test(value||'')?value:null;
  const safeColor=(value,fallback)=>/^#[0-9a-f]{6}$/i.test(value||'')?value:fallback;
  function contrastText(hex){const c=hex.slice(1).match(/../g).map(n=>parseInt(n,16));return c[0]*.299+c[1]*.587+c[2]*.114>155?'#151207':'#fff';}
  function applyBrand(value){
    const accent=safeColor(value.accent,defaults.accent),background=safeColor(value.background,defaults.background);
    document.documentElement.style.setProperty('--brand',accent);
    document.documentElement.style.setProperty('--gold',accent);
    document.documentElement.style.setProperty('--brand-ink',contrastText(accent));
    document.documentElement.style.setProperty('--store-bg',background);
    document.querySelectorAll('[class~="text-[#D4AF37]"]').forEach(el=>el.style.color=accent);
    if(!publicMode){const brand=document.querySelector('body>header>div');if(brand){brand.innerHTML=`${imageSource(value.logo)?`<img class="brand-logo" src="${esc(value.logo)}" alt="Logo de ${esc(value.name)}">`:'<span class="gold rounded-xl p-3 font-bold">M</span>'}<div><b class="text-xl tracking-widest">${esc(value.name)}</b><p class="text-xs muted">CONTROLE & RESULTADOS · v2.0</p></div>`;}}
    document.title=publicMode?`${value.name} • Catálogo`:`${value.name} • Gestão • v2.0`;
  }
  // A migração é complementar. Nenhuma tabela de vendas ou movimentações é apagada.
  const catalogSQL=`
begin;
alter table public.products add column if not exists online boolean not null default false;
alter table public.products add column if not exists category text not null default '';
alter table public.products add column if not exists description text not null default '';
create index if not exists products_public_catalog on public.products(user_id,online,id);
create table if not exists public.store_settings(
 user_id uuid primary key default auth.uid() references auth.users(id),
 name text not null default 'MHY IMPORTS' check(length(trim(name)) between 1 and 100),
 tagline text not null default '' check(length(tagline)<=300),
 headline text not null default '' check(length(headline)<=160),
 whatsapp text not null default '' check(whatsapp='' or whatsapp ~ '^[1-9][0-9]{9,14}$'),
 accent text not null default '#D4AF37' check(accent ~ '^#[0-9A-Fa-f]{6}$'),
 background text not null default '#0c0d10' check(background in ('#0c0d10','#111827','#171717')),
 logo text check(logo is null or (length(logo)<=500000 and logo like 'data:image/jpeg;base64,%')),
 banner text check(banner is null or (length(banner)<=1800000 and banner like 'data:image/jpeg;base64,%')),
 published boolean not null default false
);
alter table public.store_settings enable row level security;
drop policy if exists store_owner on public.store_settings;
create policy store_owner on public.store_settings for all to authenticated
 using(user_id=auth.uid()) with check(user_id=auth.uid());
revoke all on public.store_settings from public,anon,authenticated;
grant select,insert,update,delete on public.store_settings to authenticated;

-- Catálogo só recebe os campos abaixo; custo e finanças não são concedidos ao visitante.
create or replace function public.get_storefront(store uuid)
returns table(name text,tagline text,headline text,whatsapp text,accent text,background text,logo text,banner text)
language sql stable security definer set search_path=public
as $$
 select s.name,s.tagline,s.headline,s.whatsapp,s.accent,s.background,s.logo,s.banner
 from public.store_settings s where s.user_id=store and s.published=true;
$$;
create or replace function public.get_catalog_products(store uuid,page_number integer default 0)
returns table(id uuid,name text,sku text,price bigint,image text,available boolean,category text,description text)
language sql stable security definer set search_path=public
as $$
 select p.id,p.name,p.sku,p.price,p.image,(p.stock>0),left(p.category,60),left(p.description,1000)
 from public.products p join public.store_settings s on s.user_id=p.user_id
 where s.user_id=store and s.published=true and p.online=true
 order by p.id limit 100 offset (greatest(0,least(coalesce(page_number,0),10000))*100);
$$;
revoke all on function public.get_storefront(uuid) from public,anon,authenticated;
revoke all on function public.get_catalog_products(uuid,integer) from public,anon,authenticated;
grant execute on function public.get_storefront(uuid) to anon,authenticated;
grant execute on function public.get_catalog_products(uuid,integer) to anon,authenticated;
do $$ begin
 if not exists(select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='store_settings') then
  alter publication supabase_realtime add table public.store_settings;
 end if;
end $$;
commit;
`;
  if(!publicMode){
    const nav=document.querySelector('nav');
    nav.insertAdjacentHTML('beforeend','<button data-tab="personalization">Personalizar</button>');
    $('demoNotice').insertAdjacentHTML('beforebegin','<p class="muted text-xs mb-4">MHY v2.0 · Personalização e catálogo</p>');
    const panel=document.createElement('section');panel.id='personalization';panel.className='hidden';
    panel.innerHTML=`<form id="brandForm" class="space-y-5">
      <div class="panel"><h2>Identidade da sua loja</h2><p class="muted text-sm mt-2">Logo, cores e banners ficam salvos no Supabase e são usados no PC, no celular e no catálogo. Você controla quando publicar.</p></div>
      <p id="brandFeedback" role="status" class="panel hidden"></p>
      <div class="settings-grid">
       <div class="panel space-y-4"><h2>Marca e contato</h2>
        <label class="block"><span class="label">Nome da loja</span><input name="storeName" maxlength="100" required></label>
        <label class="block"><span class="label">Título do banner</span><input name="headline" maxlength="160"></label>
        <label class="block"><span class="label">Mensagem para seus clientes</span><textarea name="tagline" maxlength="300" rows="3"></textarea></label>
        <label class="block"><span class="label">WhatsApp para pedidos • com país e DDD</span><input name="whatsapp" type="tel" placeholder="55 + DDD + número" maxlength="25"><small>Somente números. Exemplo de formato: 5511999999999.</small></label>
        <label class="block"><span class="label">Cor de destaque</span><input name="accent" type="color" class="!h-12"></label>
        <label class="block"><span class="label">Fundo</span><select name="background"><option value="#0c0d10">Preto grafite</option><option value="#111827">Azul escuro</option><option value="#171717">Grafite</option></select></label>
       </div>
       <div class="panel space-y-4"><h2>Imagens da loja</h2>
        <label class="block"><span class="label">Logo • até 12 MB</span><input id="brandLogo" type="file" accept="image/*"></label>
        <img id="brandLogoPreview" class="brand-logo" alt="Prévia da logo"><button type="button" data-clear-brand="logo">Remover logo</button>
        <label class="block"><span class="label">Banner • até 12 MB</span><input id="brandBanner" type="file" accept="image/*"><small>Prefira uma imagem horizontal. A foto será comprimida antes de salvar.</small></label>
        <img id="brandBannerPreview" class="brand-preview" alt="Prévia do banner"><button type="button" data-clear-brand="banner">Remover banner</button>
        <p class="catalog-note">As imagens e os textos do catálogo ficam públicos quando você o ativa.</p>
       </div>
      </div>
      <div class="panel space-y-4"><h2>Catálogo para clientes</h2>
       <label class="check-line"><input name="published" type="checkbox"><span>Ativar catálogo público</span></label>
       <p class="catalog-note">Somente produtos marcados com “Exibir no catálogo” aparecem. Pedidos pelo WhatsApp não reservam estoque e não confirmam vendas automaticamente.</p>
       <p id="catalogLink" class="muted">Entre na sua conta para gerar o link da loja.</p>
       <div class="flex gap-3 flex-wrap"><button type="button" id="copyCatalogLink">Copiar link</button><button type="button" id="openCatalogLink">Abrir catálogo</button></div>
      </div>
      <div class="flex gap-3 flex-wrap"><button class="gold" id="saveBrand">Salvar personalização</button><button type="button" id="resetBrand">Descartar alterações</button></div>
     </form>
     <details class="panel mt-6" open><summary>Ativar a nova estrutura no Supabase • uma vez</summary><p class="muted text-sm my-4">Copie este SQL complementar e execute no SQL Editor do seu projeto. Ele adiciona personalização e protege o acesso público. Produtos existentes continuam privados até você escolher exibi-los.</p><button type="button" id="copyCatalogSQL">Copiar SQL complementar</button><pre id="catalogSQL" class="mt-4"></pre></details>`;
    document.querySelector('main>details').before(panel);
    $('catalogSQL').textContent=catalogSQL;
    $('copyCatalogSQL').onclick=async()=>{try{await navigator.clipboard.writeText(catalogSQL);notify('SQL complementar copiado.');}catch{notify('Selecione e copie o SQL exibido abaixo.');}};
    // Acrescenta dados públicos opcionais sem alterar os campos já existentes.
    $('productForm').querySelector('.grid').insertAdjacentHTML('beforeend',`<label class="col-span-2"><span class="label">Categoria • opcional</span><input name="category" maxlength="60" placeholder="Perfumes, bolsas, acessórios…"></label><label class="col-span-2"><span class="label">Descrição para clientes • opcional</span><textarea name="description" maxlength="1000" rows="3"></textarea></label><label class="check-line col-span-2"><input type="checkbox" name="online"><span>Exibir este produto no catálogo público</span></label>`);
    const originalEdit=editProduct;
    editProduct=function(id){originalEdit(id);const p=products.find(p=>p.id===id),form=$('productForm');form.elements.category.value=p?.category||'';form.elements.description.value=p?.description||'';form.elements.online.checked=Boolean(p?.online);};
    const originalSave=saveProduct;
    saveProduct=async function(data){const f=$('productForm');if(user&&!settingsAvailable)throw Error('Execute o SQL complementar em Personalizar antes de salvar produtos nesta versão.');return originalSave({...data,category:f.elements.category.value.trim(),description:f.elements.description.value.trim(),online:f.elements.online.checked});};
    const originalRender=render;
    render=function(){originalRender();applyBrand(settings);};
    const originalLoad=load;
    load=async function(){await originalLoad();if(!user)return;const currentUser=user.id;const {data,error}=await db.from('store_settings').select('*').eq('user_id',currentUser).maybeSingle();if(user?.id!==currentUser)return;if(error){settingsAvailable=false;showBrandFeedback('Execute o SQL complementar abaixo para ativar a personalização e o catálogo. Seu estoque e suas vendas continuam preservados.',true);return;}settingsAvailable=true;settings={...defaults,...(data||{})};if(!dirty)fillBrandForm();applyBrand(settings);updateCatalogLink();};
    const originalSession=applySession;
    applySession=async function(session){if(!session?.user){settings={...defaults};dirty=false;fillBrandForm();applyBrand(settings);}await originalSession(session);updateCatalogLink();};
    document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab?.dataset.tab==='personalization')$('pageTitle').textContent='Personalize sua loja';const clear=e.target.closest('[data-clear-brand]');if(clear){media[clear.dataset.clearBrand]=null;dirty=true;renderBrandImages();applyBrand(readBrandForm());}});
    fillBrandForm();applyBrand(settings);
    $('brandForm').addEventListener('input',()=>{dirty=true;applyBrand(readBrandForm());});
    $('brandLogo').onchange=e=>readBrandImage(e,'logo');$('brandBanner').onchange=e=>readBrandImage(e,'banner');
    $('resetBrand').onclick=()=>{dirty=false;fillBrandForm();applyBrand(settings);showBrandFeedback('Alterações não salvas foram descartadas.');};
    $('brandForm').onsubmit=async e=>{e.preventDefault();if(settingsSaveBusy)return;if(!user)return showBrandFeedback('Entre na sua conta para salvar a personalização entre aparelhos.',true);const value=readBrandForm();if(!value.name)return showBrandFeedback('Informe o nome da loja.',true);if(value.whatsapp&&!/^[1-9][0-9]{9,14}$/.test(value.whatsapp))return showBrandFeedback('Informe o WhatsApp com país e DDD, usando de 10 a 15 números.',true);if(value.published&&!value.whatsapp)return showBrandFeedback('Informe o WhatsApp antes de ativar o catálogo para receber pedidos.',true);settingsSaveBusy=true;lockBrandSave();try{const {error}=await db.from('store_settings').upsert({...value,user_id:user.id},{onConflict:'user_id'});if(error)throw error;settings=value;settingsAvailable=true;dirty=false;fillBrandForm();applyBrand(settings);updateCatalogLink();showBrandFeedback('Personalização salva no Supabase. '+(value.published?'Seu catálogo está ativo.':'O catálogo está desativado.'));}catch(error){showBrandFeedback('Não foi possível salvar. '+error.message+' Se a tabela não existe, execute o SQL complementar abaixo.',true);}finally{settingsSaveBusy=false;lockBrandSave();}};
    $('copyCatalogLink').onclick=async()=>{const link=catalogLink();if(!link)return notify('Entre na sua conta para gerar o link.');try{await navigator.clipboard.writeText(link);notify('Link copiado. Confira se o catálogo está ativo antes de compartilhar.');}catch{notify('Copie o endereço exibido na tela.');}};
    $('openCatalogLink').onclick=()=>{const link=catalogLink();if(!link)return notify('Entre na sua conta primeiro.');if(location.protocol==='file:')return notify('Publique a versão atualizada no Netlify antes de compartilhar o catálogo.');window.open(link,'_blank','noopener,noreferrer');};
  }
  function showBrandFeedback(message,error=false){const el=$('brandFeedback');if(!el)return;el.textContent=message;el.classList.remove('hidden');el.style.borderColor=error?'#d66':'var(--brand)';}
  function readBrandForm(){const form=$('brandForm');return {name:form.elements.storeName.value.trim(),headline:form.elements.headline.value.trim(),tagline:form.elements.tagline.value.trim(),whatsapp:form.elements.whatsapp.value.replace(/\D/g,''),accent:form.elements.accent.value,background:form.elements.background.value,logo:media.logo,banner:media.banner,published:form.elements.published.checked};}
  function fillBrandForm(){const form=$('brandForm');if(!form)return;form.elements.storeName.value=settings.name;for(const key of ['headline','tagline','whatsapp','accent','background'])form.elements[key].value=settings[key];form.elements.published.checked=settings.published;media={logo:settings.logo,banner:settings.banner};$('brandLogo').value='';$('brandBanner').value='';renderBrandImages();}
  function renderBrandImages(){for(const key of ['logo','banner']){const img=$(key==='logo'?'brandLogoPreview':'brandBannerPreview');img.src=imageSource(media[key])||placeholder;}}
  let imageBusy=0;
  function lockBrandSave(){$('saveBrand').disabled=Boolean(imageBusy||settingsSaveBusy);$('saveBrand').textContent=settingsSaveBusy?'Salvando…':imageBusy?'Preparando imagem…':'Salvar personalização';}
  async function readBrandImage(e,key){const file=e.target.files[0];if(!file)return;imageBusy++;lockBrandSave();try{if(!file.type.startsWith('image/')||file.size>12*1024*1024)throw Error('Escolha uma imagem de até 12 MB.');const objectURL=URL.createObjectURL(file);try{const img=new Image();img.src=objectURL;await img.decode();const max=key==='logo'?512:1600,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const image=canvas.toDataURL('image/jpeg',.78);if(image.length>(key==='logo'?500000:1800000))throw Error('Escolha uma imagem menor ou menos detalhada.');media[key]=image;dirty=true;renderBrandImages();applyBrand(readBrandForm());}finally{URL.revokeObjectURL(objectURL);}}catch(error){showBrandFeedback(error.message,true);}finally{imageBusy--;lockBrandSave();}}
  function catalogLink(){if(!user)return '';const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('loja',user.id);return url.href;}
  function updateCatalogLink(){const el=$('catalogLink');if(!el)return;el.textContent=user?(location.protocol==='file:'?'Publique este arquivo no Netlify para compartilhar o catálogo.':catalogLink()+(settings.published?'':' • catálogo desativado')):'Entre na sua conta para gerar o link da loja.';}
  // Modo público usa cliente anônimo separado e somente funções com campos permitidos.
  if(publicMode){
    applySession=async()=>{};
    document.body.classList.add('catalog-mode');
    const root=document.createElement('div');root.id='storefrontRoot';document.body.append(root);
    if(!validId(storeId)){root.innerHTML='<div class="panel public-status"><h1>Link de loja inválido</h1><p class="muted">Peça à loja o endereço atualizado do catálogo.</p></div>';return;}
    if(!window.supabase||!SUPABASE_URL||!SUPABASE_ANON_KEY){root.innerHTML='<div class="panel public-status"><h1>Não foi possível carregar a loja</h1><p class="muted">Confira sua internet e recarregue a página.</p><button onclick="location.reload()">Tentar novamente</button></div>';return;}
    publicClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mhy-public-catalog'},global:{fetch:fetchWithTimeout}});
    root.innerHTML='<div class="panel public-status" role="status">Carregando catálogo…</div>';
    publicCartDialog=document.createElement('dialog');publicCartDialog.id='catalogCartDialog';publicCartDialog.setAttribute('aria-labelledby','catalogCartTitle');document.body.append(publicCartDialog);
    publicCartDialog.addEventListener('click',e=>{if(e.target.closest('[data-public-close]'))publicCartDialog.close();const button=e.target.closest('[data-public-adjust]');if(button)adjustPublicCart(button.dataset.id,Number(button.dataset.publicAdjust));});
    root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.publicAdd)adjustPublicCart(button.dataset.publicAdd,1);if(button.id==='showPublicCart'){renderPublicCart();publicCartDialog.showModal();}if(button.id==='retryCatalog')refreshPublicCatalog();});
    refreshPublicCatalog();
    publicRefreshTimer=setInterval(()=>{if(!document.hidden)refreshPublicCatalog();},30000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshPublicCatalog();});
    window.addEventListener('pagehide',()=>clearInterval(publicRefreshTimer),{once:true});
  }
  async function refreshPublicCatalog(){
    if(publicRefreshPromise)return publicRefreshPromise;
    publicRefreshPromise=performPublicRefresh();
    try{return await publicRefreshPromise;}finally{publicRefreshPromise=null;}
  }
  async function performPublicRefresh(){
    publicBusy=true;
    try{
      const {data,error}=await publicClient.rpc('get_storefront',{store:storeId});if(error)throw error;
      if(!data?.length){publicReady=false;publicSettings=null;publicProducts=[];publicCart.clear();publicCartDialog?.close();$('storefrontRoot').innerHTML='<div class="panel public-status"><h1>Catálogo indisponível</h1><p class="muted">Esta loja ainda não publicou seu catálogo ou desativou o link.</p><button id="retryCatalog">Tentar novamente</button></div>';return;}
      const next=[];
      for(let page=0;;page++){if(page>10000)throw Error('Catálogo muito grande. Entre em contato com a loja.');const {data:batch,error}=await publicClient.rpc('get_catalog_products',{store:storeId,page_number:page});if(error)throw error;next.push(...batch);if(batch.length<100)break;}
      publicSettings=data[0];publicProducts=next;publicReady=true;
      let removed=false;for(const [id]of publicCart){if(!publicProducts.some(p=>p.id===id&&p.available)){publicCart.delete(id);removed=true;}}
      const first=!$('storeSearch');if(first)renderStorefront();else{applyBrand(publicSettings);updatePublicBrand();renderPublicProducts();updatePublicDock();}
      if(publicCartDialog?.open){renderPublicCart();if(removed)$('catalogFeedback').textContent='Um produto ficou indisponível e foi removido do pedido.';}
      $('publicSync').textContent='Catálogo atualizado';
    }catch(error){publicReady=false;if(!$('storeSearch'))$('storefrontRoot').innerHTML='<div class="panel public-status"><h1>Não foi possível carregar o catálogo</h1><p class="muted">Confira sua conexão ou peça à loja para verificar a publicação.</p><button id="retryCatalog">Tentar novamente</button></div>';else{$('publicSync').textContent='Sem atualização. Verifique sua conexão.';}if($('sendWhatsApp'))$('sendWhatsApp').disabled=true;}
    finally{publicBusy=false;}
  }
  function renderStorefront(){
    $('storefrontRoot').innerHTML=`<header class="store-header" id="publicBrand"></header><div class="store-hero" id="publicHero"></div><div class="store-filters"><input id="storeSearch" placeholder="O que você procura?" aria-label="Buscar no catálogo"><select id="storeCategory" aria-label="Filtrar categoria"><option value="">Todas as categorias</option></select></div><p id="publicSync" class="catalog-note mb-4" role="status">Catálogo atualizado</p><div id="publicProducts" class="store-grid"></div><p class="catalog-note mt-6">Pedidos enviados pelo WhatsApp estão sujeitos à confirmação de disponibilidade, preço, pagamento e entrega pela loja.</p><div class="store-dock"><div><b id="publicCartTotal">Sua sacola está vazia</b><small id="publicCartCount">Escolha seus favoritos</small></div><button class="gold" id="showPublicCart">Ver sacola</button></div>`;
    applyBrand(publicSettings);updatePublicBrand();renderPublicProducts();updatePublicDock();
    $('storeSearch').oninput=renderPublicProducts;$('storeCategory').onchange=renderPublicProducts;
  }
  function updatePublicBrand(){const s=publicSettings;$('publicBrand').innerHTML=`${imageSource(s.logo)?`<img class="brand-logo" src="${esc(s.logo)}" alt="Logo de ${esc(s.name)}">`:'<span class="gold rounded-xl p-3 font-bold">M</span>'}<div><b class="text-xl">${esc(s.name)}</b><p class="muted text-xs">CATÁLOGO ONLINE</p></div>`;$('publicHero').innerHTML=`${imageSource(s.banner)?`<img src="${esc(s.banner)}" alt="Banner de ${esc(s.name)}">`:''}<div><span class="badge">SELECIONADOS PARA VOCÊ</span><h1>${esc(s.headline||s.name)}</h1><p>${esc(s.tagline)}</p></div>`;const select=$('storeCategory'),selected=select.value;const categories=[...new Set(publicProducts.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));select.innerHTML='<option value="">Todas as categorias</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(categories.includes(selected))select.value=selected;}
  function renderPublicProducts(){const term=$('storeSearch').value.trim().toLowerCase(),category=$('storeCategory').value;const matches=publicProducts.filter(p=>(p.name+' '+p.sku+' '+p.description).toLowerCase().includes(term)&&(!category||p.category===category));$('publicProducts').innerHTML=matches.map(p=>`<article class="store-card"><img loading="lazy" src="${esc(imageSource(p.image)||placeholder)}" alt="${esc(p.name)}"><div class="store-card-content">${p.category?`<small>${esc(p.category)}</small>`:''}<h2>${esc(p.name)}</h2>${p.description?`<p>${esc(p.description)}</p>`:''}<div class="store-price">${money(p.price)}</div><small>${p.available?'Disponível':'Indisponível no momento'}</small><button class="gold" data-public-add="${p.id}" ${!p.available?'disabled':''}>${p.available?'Adicionar à sacola':'Indisponível'}</button></div></article>`).join('')||'<div class="panel muted">Nenhum produto encontrado. Tente outra busca ou volte em breve.</div>';}
  function adjustPublicCart(id,delta){const p=publicProducts.find(p=>p.id===id);if(!p||!p.available)return;const qty=(publicCart.get(id)||0)+delta;if(qty>99)return notify('Máximo de 99 unidades por produto no pedido.');if(qty<=0)publicCart.delete(id);else publicCart.set(id,qty);updatePublicDock();if(publicCartDialog?.open)renderPublicCart();}
  function publicTotals(){let amount=0,count=0;for(const [id,qty]of publicCart){const p=publicProducts.find(p=>p.id===id);if(p){amount+=p.price*qty;count+=qty;}}return {amount,count};}
  function updatePublicDock(){const t=publicTotals();$('publicCartTotal').textContent=t.count?money(t.amount):'Sua sacola está vazia';$('publicCartCount').textContent=t.count?`${t.count} item(ns) no pedido`:'Escolha seus favoritos';}
  function renderPublicCart(){const t=publicTotals();publicCartDialog.innerHTML=`<div class="dialog-header"><h2 id="catalogCartTitle">Sua sacola</h2><button class="dialog-close" data-public-close type="button">✕ Fechar</button></div><div>${[...publicCart].map(([id,qty])=>{const p=publicProducts.find(p=>p.id===id);return p?`<div class="flex items-center gap-3 border-b border-white/10 py-3">${thumb(p)}<div class="flex-1"><b>${esc(p.name)}</b><small class="block">${qty} × ${money(p.price)}</small></div><button data-public-adjust="-1" data-id="${id}" aria-label="Remover unidade">−</button><button data-public-adjust="1" data-id="${id}" aria-label="Adicionar unidade">+</button></div>`:'';}).join('')||'<p class="muted py-5">Sua sacola está vazia.</p>'}</div><p class="flex justify-between my-5"><b>Total dos produtos</b><strong style="color:var(--brand)">${money(t.amount)}</strong></p><p class="catalog-note">O envio abre o WhatsApp para você revisar e enviar a mensagem. Não confirma pagamento, frete, venda ou reserva de estoque.</p><p id="catalogFeedback" class="my-3" role="status"></p><button class="gold w-full mt-3" id="sendWhatsApp" ${!t.count||!publicReady||!publicSettings?.whatsapp?'disabled':''}>Pedir pelo WhatsApp</button>${!publicSettings?.whatsapp?'<p class="catalog-note mt-3">A loja ainda não configurou o WhatsApp.</p>':''}`;$('sendWhatsApp').onclick=sendPublicOrder;}
  async function sendPublicOrder(){
    const button=$('sendWhatsApp');button.disabled=true;button.textContent='Conferindo produtos…';
    const before=[...publicCart].map(([id,qty])=>({id,qty,price:publicProducts.find(p=>p.id===id)?.price}));
    // Abre a aba durante o gesto do usuário para evitar bloqueio de popup após await.
    const target=window.open('about:blank','_blank');if(target)target.opener=null;
    try{await refreshPublicCatalog();if(!publicReady||!publicSettings)throw Error('Não foi possível atualizar a loja. Confira sua conexão e tente novamente.');if(!/^[1-9][0-9]{9,14}$/.test(publicSettings.whatsapp||''))throw Error('A loja não configurou um WhatsApp válido.');const changed=before.some(item=>{const p=publicProducts.find(p=>p.id===item.id);return !p||!p.available||p.price!==item.price;});if(changed){if(target)target.close();renderPublicCart();$('catalogFeedback').textContent='O preço ou a disponibilidade mudou. Revise a sacola e clique novamente para enviar.';return;}if(!publicCart.size)throw Error('Adicione um produto à sacola.');const lines=[`Olá, ${publicSettings.name}! Gostaria de fazer este pedido:`,'',...[...publicCart].map(([id,qty])=>{const p=publicProducts.find(p=>p.id===id);return `${qty} × ${p.name} (${p.sku}) — ${money(p.price*qty)}`;}),'',`Total dos produtos: ${money(publicTotals().amount)}`,'Aguardo confirmação de disponibilidade, pagamento, entrega e total final.'];const url='https://wa.me/'+publicSettings.whatsapp+'?text='+encodeURIComponent(lines.join('\n'));if(target)target.location.href=url;else location.assign(url);$('catalogFeedback').textContent='Pedido preparado. Revise a mensagem no WhatsApp e envie para a loja.';}catch(error){if(target)target.close();if(!publicCartDialog.open)notify(error.message);else{if(!$('catalogFeedback'))renderPublicCart();$('catalogFeedback').textContent=error.message;}}finally{if($('sendWhatsApp')){$('sendWhatsApp').disabled=!publicReady||!publicCart.size||!publicSettings?.whatsapp;$('sendWhatsApp').textContent='Pedir pelo WhatsApp';}}
  }
})();
</script>
